; PHP settings for the approval app. .user.ini is the right mechanism on
; cPanel: EA-PHP runs LSAPI or PHP-FPM, where php_value in .htaccess is a 500.
;
; Cached for user_ini.cache_ttl (300s by default). After editing, wait five
; minutes or touch this file. The installer reads the EFFECTIVE values back
; with ini_get() and refuses to finish if they did not take.

; A3 uploads images as base64 inside JSON. An 8 MB PNG is ~10.7 MB encoded,
; and the body is held in memory twice (parsed, then re-encoded for the
; idempotency hash). 32M matches the mock's own cap.
post_max_size = 32M
memory_limit = 256M
max_execution_time = 120
max_input_time = 120

; A stack trace in a JSON body would leak the database password.
display_errors = 0
log_errors = 1
